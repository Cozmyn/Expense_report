name: Validate expense platform
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  p0-ops-offline:
    name: P0 restore and Production UAT safety checks (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s deploy -p 'test_*.py' -v
  audit-pilot-metrics-offline:
    name: Audit OCR pilot metrics (offline calculation, no real documents)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s deploy -p 'test_ocr_pilot_metrics.py' -v
  build-and-test:
    name: Backend and frontend (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: ui/package-lock.json}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - run: npm ci --prefix ui && npm audit --prefix ui --audit-level=high && npm test --prefix ui && npm run build --prefix ui
      - name: Backend tests
        env:
          OCR_QUALITY_OUTPUT: tests/TestResults/ocr-quality.json
          ERP_REFERENCE_OUTPUT: tests/TestResults/erp-reference
          TEST_POSTGRES: ${{ matrix.database == 'postgres' && 'Host=localhost;Database=postgres;Username=postgres;Password=ci-test-only' || '' }}
        run: dotnet test tests/Decont.Tests.csproj --configuration Release --logger "trx;LogFileName=backend.trx"
      - name: Export EF schema DDL for reviewed baseline and drift checks
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Database__Provider: ${{ matrix.database == 'postgres' && 'Postgres' || 'Sqlite' }}
          ConnectionStrings__Database: 'Host=localhost;Database=postgres;Username=postgres;Password=ci-test-only'
        run: |
          mkdir -p tests/TestResults
          dotnet run --no-restore --project server/Decont.Api.csproj -c Release -- --schema > tests/TestResults/model-schema-${{ matrix.database }}.sql
          test -s tests/TestResults/model-schema-${{ matrix.database }}.sql
          python3 - <<'PY'
          from pathlib import Path
          import os
          # Release 14 schema is immutable: any future EF change must be paired
          # with a separately reviewed, numbered migration script.
          database = "${{ matrix.database }}"
          actual = Path(f"tests/TestResults/model-schema-{database}.sql").read_text().replace("\\r\\n", "\\n").strip()
          pinned = Path(f"server/Migrations/001-baseline.{database}.sql").read_text().replace("\\r\\n", "\\n").strip()
          if actual != pinned:
              raise SystemExit("EF model differs from pinned release-14 baseline; add reviewed migration")
          PY
      - run: dotnet publish server/Decont.Api.csproj --configuration Release --output release
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: 'verification-${{ matrix.database }}', path: 'tests/TestResults/*'}
      - uses: actions/upload-artifact@v4
        if: matrix.database == 'postgres'
        with: {name: application, path: release/}
  browser-workflows:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      scanner:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        options: >-
          --health-cmd "clamdscan --ping=1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://127.0.0.1:5080
      Data__Directory: ${{ github.workspace }}/.e2e-data
      Storage__Directory: ${{ github.workspace }}/.e2e-data/objects
      Scanner__Host: localhost
      Ocr__Enabled: 'true'
      Ocr__ServiceUrl: http://127.0.0.1:8750
      Bootstrap__Username: ci-admin
      Bootstrap__Email: ci-admin@example.invalid
      Bootstrap__Password: Ci-only-bootstrap-Password1!
      E2E_ADMIN_PASSWORD: Ci-only-bootstrap-Password1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - uses: actions/download-artifact@v4
        with: {name: application, path: release}
      - name: Configure bounded dependency downloads
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf 'https://security.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors-security.txt
          fi
          printf 'Acquire::Retries "2";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/99-expense-ci
      - name: Install browser test packages
        timeout-minutes: 3
        run: npm ci --prefix ui --fetch-retries=2 --fetch-timeout=60000
      - name: Install browser system and OCR dependencies
        timeout-minutes: 5
        working-directory: ui
        run: |
          npx playwright install-deps chromium
          sudo apt-get install -y fonts-dejavu-core tesseract-ocr tesseract-ocr-ron tesseract-ocr-eng tesseract-ocr-osd poppler-utils imagemagick libheif-examples
      - name: Install Chromium
        timeout-minutes: 3
        working-directory: ui
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: npx playwright install chromium
      - name: Build the real PaddleOCR CPU service
        timeout-minutes: 16
        run: docker build -f ocr/Dockerfile -t expense-paddle:browser .
      - name: Start the OCR service used by real browser scans
        timeout-minutes: 12
        run: |
          docker volume create expense-paddle-browser-models
          docker run -d --name expense-paddle-browser --memory 5g \
            -p 127.0.0.1:8750:8750 \
            -v expense-paddle-browser-models:/models \
            --read-only --tmpfs /tmp:size=268435456,mode=1777 \
            --security-opt no-new-privileges:true \
            expense-paddle:browser
          for attempt in $(seq 1 100); do
            if curl -fsS --max-time 4 http://127.0.0.1:8750/health > /tmp/expense-ocr-health.json; then
              python3 -c "import json; h=json.load(open('/tmp/expense-ocr-health.json')); assert h['status']=='Ready' and h['engine']=='PP-OCRv6'"
              exit 0
            fi
            sleep 5
          done
          docker logs --tail 100 expense-paddle-browser
          exit 1
      - name: Start application
        run: |
          dotnet release/Decont.Api.dll --contentRoot "$PWD/release" --bootstrap
          dotnet release/Decont.Api.dll --contentRoot "$PWD/release" > application.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5080/health/ready; then exit 0; fi
            sleep 1
          done
          cat application.log
          exit 1
      - run: npm run test:e2e --prefix ui
      - name: Failure context
        if: failure()
        run: |
          docker logs --tail 80 expense-paddle-browser || true
          python -c "from pathlib import Path; p=Path('application.log'); s=p.read_text() if p.exists() else 'Application did not start; inspect dependency setup steps.'; print('\n'.join(s.splitlines()[max(0,s[:s.find('failed')].count(chr(10))-3):][:90]) if 'failed' in s else s[-20000:])"
          python -c "from pathlib import Path; [print(p.read_text()) for p in Path('ui/test-results').rglob('error-context.md')]"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            ui/playwright-report/
            ui/test-results/
            application.log
  container-launch:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the application container
        run: |
          docker build -t decont:ci -f deploy/Dockerfile .
          docker volume create decont-ci-data
          docker run --rm -v decont-ci-data:/app/.data \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Bootstrap__Username=container-admin \
            -e Bootstrap__Email=container-admin@example.invalid \
            -e 'Bootstrap__Password=Container-test-Password1!' \
            decont:ci --bootstrap
          docker run --rm -v decont-ci-data:/app/.data \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e Bootstrap__Username=container-admin \
            -e Bootstrap__Email=container-admin@example.invalid \
            -e 'Bootstrap__Password=Container-test-Password1!' \
            decont:ci --bootstrap
          docker run -d --read-only --tmpfs /tmp:size=536870912,mode=1777 --cap-drop ALL --security-opt no-new-privileges:true --memory 1536m --pids-limit 256 --name decont-ci -p 127.0.0.1:5081:8080 \
            -v decont-ci-data:/app/.data -e ASPNETCORE_ENVIRONMENT=Development \
            -e Worker__Disabled=true decont:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5081/health/ready; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:5081/health/ready
          curl --fail http://127.0.0.1:5081/ | grep 'src="/assets/'
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:5081/api/reports)" = '401'
      - name: Container logs
        if: always()
        run: docker logs decont-ci || true

